server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: innovaura-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/proposal_governance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: dev_user
    password: Atharv@2002
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsMySuperSecretJWTKeyForLocalDevelopment123!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173,http://localhost:5031,http://127.0.0.1:5173,http://13.203.82.193,http://13.203.82.193:5173,http://13.203.82.193:8080,http://13.203.82.193:5031}

razorpay:
  key_id: ${RAZORPAY_KEY_ID:rzp_test_TMGUnzZTkKHWLG}
  key_secret: ${RAZORPAY_KEY_SECRET:8pJ7ROBcDd6IYnLhaiTf8u41}

logging:
  level:
    root: INFO
    com.innovaura: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
